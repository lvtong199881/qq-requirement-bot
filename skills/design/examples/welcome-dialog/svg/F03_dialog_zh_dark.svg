<g filter="url(#dlgShadow)"><rect x="20" y="24" width="320" height="419.7" rx="16" fill="#161920" /><rect x="20" y="24" width="320" height="339.7" rx="0" fill="none" /><text x="44" y="64.2" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="20" font-weight="600" fill="#E6E8EC" text-anchor="start" >欢迎使用 DoDroidAI</text><text x="44" y="93.9" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="15" font-weight="400" fill="#A6ADBB" text-anchor="start" >说一句话，让手机替你做事。</text><rect x="44" y="119" width="272" height="236.7" rx="0" fill="none" /><rect x="44" y="119" width="272" height="80.8" rx="0" fill="none" /><g transform="translate(44 119) scale(0.92)" fill="none" stroke="#8FA6FF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" color="#8FA6FF" ><path d="M12 3.2a2.8 2.8 0 0 0-2.8 2.8v6a2.8 2.8 0 0 0 5.6 0V6A2.8 2.8 0 0 0 12 3.2Z"/><path d="M5.5 11.2a6.5 6.5 0 0 0 13 0"/><path d="M12 17.7v3.1"/><path d="M8.6 20.8h6.8"/></g><rect x="78" y="119" width="260" height="80.8" rx="0" fill="none" /><text x="78" y="134.53" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="15" font-weight="600" fill="#E6E8EC" text-anchor="start" >按住说话就行</text><text x="78" y="157.36" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" font-weight="400" fill="#A6ADBB" text-anchor="start" >语音识别和朗读在手机本地完成；首次使用需<tspan x="78" dy="18.85">联网下载语音模型（默认 Wi-Fi </tspan><tspan x="78" dy="18.85">下自动下载）。</tspan></text><rect x="44" y="215.8" width="272" height="61.95" rx="0" fill="none" /><g transform="translate(44 215.8) scale(0.92)" fill="none" stroke="#8FA6FF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" color="#8FA6FF" ><path d="M8.4 2.4h7.2a2.2 2.2 0 0 1 2.2 2.2v14.8a2.2 2.2 0 0 1-2.2 2.2H8.4a2.2 2.2 0 0 1-2.2-2.2V4.6a2.2 2.2 0 0 1 2.2-2.2Z"/><path d="M10.4 4.9h3.2"/><path d="M11 19.2h2"/></g><rect x="78" y="215.8" width="260" height="61.95" rx="0" fill="none" /><text x="78" y="231.33" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="15" font-weight="600" fill="#E6E8EC" text-anchor="start" >它会动手，不只是聊天</text><text x="78" y="254.16" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" font-weight="400" fill="#A6ADBB" text-anchor="start" >发短信、记笔记前会先请你确认；闹钟、日历<tspan x="78" dy="18.85">等操作直接执行。</tspan></text><rect x="44" y="293.75" width="272" height="61.95" rx="0" fill="none" /><g transform="translate(44 293.75) scale(0.92)" fill="none" stroke="#8FA6FF" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" color="#8FA6FF" ><path d="M7.2 10.2h9.6a2 2 0 0 1 2 2v6.6a2 2 0 0 1-2 2H7.2a2 2 0 0 1-2-2v-6.6a2 2 0 0 1 2-2Z"/><path d="M8.4 10.2V7.4a3.6 3.6 0 0 1 7.2 0v2.8"/><circle cx="12" cy="15" r="1.05" fill="currentColor" stroke="none"/></g><rect x="78" y="293.75" width="229.58" height="61.95" rx="0" fill="none" /><text x="78" y="309.27" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="15" font-weight="600" fill="#E6E8EC" text-anchor="start" >会话和笔记留在本机</text><text x="78" y="332.11" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="13" font-weight="400" fill="#A6ADBB" text-anchor="start" >保存在本机，会话可随时导出；使用 AI <tspan x="78" dy="18.85">时内容会发送给你配置的服务商。</tspan></text><rect x="20" y="363.7" width="320" height="80" rx="0" fill="none" /><rect x="40" y="375.7" width="280" height="48" rx="24" fill="#8FA6FF" /><text x="180" y="405.1" font-family="'Segoe UI','Microsoft YaHei','Noto Sans SC',sans-serif" font-size="15" font-weight="600" fill="#0A1F5C" text-anchor="middle" >开始使用</text></g>
