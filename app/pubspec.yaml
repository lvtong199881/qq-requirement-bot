name: qqbot_app
description: "需求全流程的移动端：看需求、拍板、打回。"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # 三个本地模块包：网络/换址在 network，会话与登录在 login，公共 UI 在 base
  base:
    path: packages/base
  network:
    path: packages/network
  login:
    path: packages/login
  # 只剩两个直接依赖，都是「不引就得自己写一套」的：
  # - intl：相对时间/日期的中文本地化
  # - mobile_scanner/image_picker：扫码进 login 模块的注入页用
  intl: ^0.20.3
  mobile_scanner: ^7.5.0
  qr_flutter: ^4.1.0
  path_provider: ^2.1.6
  share_plus: ^13.0.0
  gal: ^2.3.2
  image_picker: ^1.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  # 测试里用 MockClient 打桩网络
  http: ^1.6.0
  # 测试里 setMockInitialValues 打桩安全存储（本体在 login 包）
  flutter_secure_storage: ^11.2.0

flutter:
  uses-material-design: true
